name: Android APK Build Smart
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Smart Auto-Fix Project Structure
        run: |
          # Create standard project folder
          mkdir -p fix-project/app/src/main/java/com/example/myapp
          mkdir -p fix-project/app/src/main/res/values

          # Smart Search: Find files wherever they are hidden and copy them safely
          find . -name "MainActivity.java" -exec cp {} fix-project/app/src/main/java/com/example/myapp/MainActivity.java \;
          find . -name "FloatingWidgetService.java" -exec cp {} fix-project/app/src/main/java/com/example/myapp/FloatingWidgetService.java \;
          find . -name "AndroidManifest.xml" -exec cp {} fix-project/app/src/main/AndroidManifest.xml \;

          cd fix-project

          # Create standard build files automatically
          echo "include ':app'" > settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.myapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.myapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # Verify files exist before compiling
          ls -R app/src/main/

      - name: Build Android APK with Gradle
        run: |
          cd fix-project
          gradle assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTool-APK
          path: fix-project/app/build/outputs/apk/debug/app-debug.apk
