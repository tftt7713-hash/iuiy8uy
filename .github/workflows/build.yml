name: Android APK Build Final
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Smart Android Project
        run: |
          # 1. Sabhi zaroori folders ko automatic create karna (Fixed Manifest Folder Bug)
          mkdir -p my-app/app/src/main/java/com/example/myapp
          mkdir -p my-app/app/src/main/res
          
          # 2. Sahi Android Manifest file generation (Fixed Path and Schema URL)
          cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              package="com.example.myapp">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <application
                  android:allowBackup="true"
                  android:label="Floating Widget App"
                  android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingWidgetService" android:enabled="true" android:exported="false"/>
              </application>
          </manifest>
          EOF

          # 3. Floating Widget Service ka Fixed Java Code generate karna
          cat << 'EOF' > my-app/app/src/main/java/com/example/myapp/FloatingWidgetService.java
          package com.example.myapp;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;

          public class FloatingWidgetService extends Service {
              private WindowManager windowManager;
              private View floatingView;
              @Override public IBinder onBind(Intent intent) { return null; }
              @Override
              public void onCreate() {
                  super.onCreate();
                  floatingView = new View(this);
                  floatingView.setBackgroundColor(0xFF00FF00); // Green Color
                  int layoutType;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      layoutType = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
                  } else {
                      layoutType = WindowManager.LayoutParams.TYPE_PHONE;
                  }
                  final WindowManager.LayoutParams params = new WindowManager.LayoutParams();
                  params.width = 150;
                  params.height = 150;
                  params.type = layoutType;
                  params.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                  params.format = PixelFormat.TRANSLUCENT;
                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 200;
                  params.y = 200;
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  if (windowManager != null) windowManager.addView(floatingView, params);
              }
              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (windowManager != null && floatingView != null) windowManager.removeView(floatingView);
              }
          }
          EOF

          # 4. MainActivity generate karna
          cat << 'EOF' > my-app/app/src/main/java/com/example/myapp/MainActivity.java
          package com.example.myapp;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                      startActivityForResult(intent, 101);
                  } else {
                      startService(new Intent(this, FloatingWidgetService.class));
                  }
              }
          }
          EOF

          # 5. Build system configuration settings files
          echo "include ':app'" > my-app/settings.gradle

          cat << 'EOF' > my-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > my-app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.myapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.myapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 6. Gradle Wrapper tool execute and configure permissions immediately
          cd my-app
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Run Official Production Build
        run: |
          cd my-app
          ./gradlew assembleDebug

      - name: Download Link Generation
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTool-APK
          path: my-app/app/build/outputs/apk/debug/app-debug.apk
