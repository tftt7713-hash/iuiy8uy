name: Android APK Build Final
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Smart Android Project
        run: |
          # Standard project folder structure creation
          mkdir -p my-app/app/src/main/java/com/example/myapp
          mkdir -p my-app/app/src/main/res/values

          # Smart Search: Automatically find files from your folders
          find . -name "MainActivity.java" -exec cp {} my-app/app/src/main/java/com/example/myapp/MainActivity.java \;
          find . -name "FloatingWidgetService.java" -exec cp {} my-app/app/src/main/java/com/example/myapp/FloatingWidgetService.java \;
          find . -name "AndroidManifest.xml" -exec cp {} my-app/app/src/main/AndroidManifest.xml \;

          cd my-app

          # Automatic environment file setup
          echo "include ':app'" > settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.myapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.myapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # Generate official command tools automatically
          gradle wrapper --gradle-version 8.5

      - name: Run Official Production Build
        run: |
          cd my-app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Download Link Generation
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTool-APK
          path: my-app/app/build/outputs/apk/debug/app-debug.apk
